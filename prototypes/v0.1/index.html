<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ef">
  <title>小泌宝 · 神经内分泌肿瘤工作台</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#dashboard" aria-label="小泌宝看板"><span class="brand-mark">泌</span><span><strong>小泌宝</strong><small>神经内分泌肿瘤工作台</small></span></a>
      <div class="topbar-right"><span class="demo-badge">模拟数据 · 原型 v0.1.3</span><button class="icon-btn" data-page="settings" aria-label="设置">⚙ <span>设置</span></button><button class="avatar" aria-label="当前档案：林女士">林</button></div>
    </header>
    <div class="workspace">
      <aside class="sidebar" aria-label="工作台导航">
        <div class="nav-label">我的工作台</div>
        <nav id="nav"></nav>
        <div class="sidebar-note"><span class="status-dot"></span>本地演示档案<br><small>所有内容均为模拟数据</small></div>
      </aside>
      <main id="main" tabindex="-1"></main>
      <aside class="agent-pane" id="agentPane" aria-label="AI 对话面板">
        <div class="agent-head"><div><span class="agent-orb">✦</span><strong>AI 对话</strong></div><button class="icon-btn small" id="hideAgent" aria-label="收起 AI 对话">−</button></div>
        <div class="agent-context"><span class="context-dot"></span>已带入：模拟病情摘要</div>
        <div class="agent-messages"><div class="agent-greeting">你好，我可以帮你整理检查报告、回顾指标变化，或准备下次就诊的问题。</div><div class="suggestion" data-prompt="请帮我整理这次的化验单，保留报告原文并列出需要我核对的信息。">整理这次化验单 <span>↗</span></div><div class="suggestion" data-prompt="请结合最近的记录，帮我整理一份下次就诊时可以询问医生的问题清单。">准备就诊问题 <span>↗</span></div><div class="suggestion" data-prompt="请帮我解释报告里的 Ki-67 和免疫组化名词，保留原文，不做分级判断。">解释报告名词 <span>↗</span></div></div>
        <div class="agent-compose"><textarea id="agentInput" rows="3" aria-label="输入问题" placeholder="说说你想整理什么…"></textarea><button id="sendAgent" class="send-btn" aria-label="发送">↑</button><small>AI 内容是待核对草稿，不会自动保存</small></div>
      </aside>
      <button id="showAgent" class="show-agent" hidden>✦ 打开 AI 对话</button>
    </div>
    <footer class="footer"><span>小泌宝 · 模拟档案，仅用于交互评审</span><span>原型 v0.1.3 · 构建日 2026-10-25 · 本地原型</span></footer>
  </div>
  <dialog id="metricPicker" class="dialog"><form method="dialog"><div class="dialog-head"><div><p class="eyebrow">一图秀</p><h2>选择要展示的指标</h2></div><button class="icon-btn" aria-label="关闭">×</button></div><p class="muted">选择后将以同一份记录生成趋势图。报告分类仅作注释，不进入数值趋势。</p><div id="metricOptions" class="metric-options"></div><div class="dialog-actions"><button class="text-btn" value="cancel">取消</button><button class="primary-btn" id="applyMetrics" value="ok">显示选中指标</button></div></form></dialog>
  <script src="./demo-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
